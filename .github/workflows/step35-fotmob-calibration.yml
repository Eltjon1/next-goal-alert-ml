name: STEP35 FotMob Threshold Calibration

on:
  workflow_dispatch:
  push:
    paths:
      - 'step35_fotmob_calibration.py'
      - 'step34_understat_reference.csv'
      - '.github/workflows/step35-fotmob-calibration.yml'

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Compile
        run: |
          python -m py_compile scanner.py
          python -m py_compile step32_365day_xg5.py
          python -m py_compile step35_fotmob_calibration.py
      - name: Calibrate FotMob thresholds
        run: python step35_fotmob_calibration.py
