name: STEP38 Build Native FotMob Dataset

on:
  workflow_dispatch:
  push:
    paths:
      - 'step38_build_fotmob_native.py'
      - 'step36_holdout_predictions.csv'
      - '.github/workflows/step38-build-fotmob-native.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Compile
        run: |
          python -m py_compile step32_365day_xg5.py
          python -m py_compile step38_build_fotmob_native.py
      - name: Build native FotMob xG5 dataset
        run: python step38_build_fotmob_native.py
      - name: Upload STEP38 dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step38-fotmob-native-dataset
          path: step38_fotmob_native_dataset.csv
          if-no-files-found: warn
