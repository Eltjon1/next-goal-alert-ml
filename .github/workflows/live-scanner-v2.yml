name: NEXT GOAL ALERT ML V2

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: next-goal-alert-live-v2
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SCAN_EVERY_SECONDS: "60"
      MIN_ALERT_LEVEL: "BASE"
      MAX_RUNTIME_SECONDS: "20700"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Validate scanner
        run: python -m py_compile scanner.py

      - name: Run live scanner
        run: python -u scanner.py
